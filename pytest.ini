# pytest 配置：项目标准验证命令 = uv run pytest
[pytest]
testpaths = test_ingest.py test_multimodal.py test_classify.py test_api.py test_rag.py test_app.py test_acceptance.py test_health.py test_planner.py test_executor.py test_review_sync.py test_growth_loop.py test_eval.py test_privacy.py test_memory_guards.py test_scheduled.py
markers =
    integration: 需要本地知识库与 API key 的端到端测试（默认跳过，用 pytest -m integration 运行）
addopts = -m "not integration"
