[project]
name = "rag-kb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mabowen1112-art", email = "mabowen1112@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
    "streamlit>=1.61.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
rag-kb = "rag_kb:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
