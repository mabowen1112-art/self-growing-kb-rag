  # ---------- q21~q26：对抗题（评测 v2，2026-09-16；评审台账 #5）----------
  # 三类：
  #   refusal 拒答（库里没有 → 必须明说没有，不许编）
  #   multi   跨文档（答案要 2~3 篇拼；min_sources = 至少命中几个不同文件）
  #   过时题（q25/q26）：用 points 判"最新口径"（库里同时存在旧说法）
  # ⚠️ 题目原文不要写进知识库（防自指污染）

  - id: q21
    check: refusal
    q: "费马大定理的完整证明过程是什么？"

  - id: q22
    check: refusal
    q: "帮我总结一下《人类简史》这本书讲了什么。"

  - id: q23
    check: multi
    q: "我的 ESP32 想法录音笔，从按下按键录音到内容进知识库，完整链路是什么？"
    sources: ["ESP32硬件课-第05课", "ESP32硬件课-第07课", "ESP32硬件课-第10课", "AI项目-ESP32硬件课", "录音笔链路测试"]
    min_sources: 3
    # 检索面独立指标（不参与判定）：只记录"拉到了几个课节页"（2026-09-16 加）
    sources_strict: ["ESP32硬件课-第05课", "ESP32硬件课-第07课", "ESP32硬件课-第10课"]
    # 判据修订（2026-09-16 v1 基线后）：初版只列课节+项目页——实际答案合理地从
    # 项目页课程地图 + 语音笔记实测记录综合，也应算数

  - id: q24
