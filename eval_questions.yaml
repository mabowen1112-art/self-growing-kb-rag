# ============================================================
# 评测集 v1（L3 调优用）— 主人：马博文
# ------------------------------------------------------------
# 怎么用：
#   1) 跑基线：      uv run python eval_kb.py
#   2) 改一个变量（rerank / top-k / 切块 / 提示词）后再跑一次：
#                    uv run python eval_kb.py
#   3) 对比两次结果：uv run python eval_kb.py --compare eval_results/基线.json
#
# 要点判定规则：每个要点 = 一组 "关键词1|关键词2|同义写法"
#   回答文本里出现【任一关键词】= 该要点命中（不区分大小写）
#
# 审校记录（2026-09-11）：初稿 AI 起草，同日完成首轮审校——
#   修正 q12 预期来源（ESP32→录音，实际命中"录音笔链路测试"笔记）；
#   q20 补硬件命名变体（ESP32S3 / ESP32 S3）；q03 的「大三」已配合实体页更新。
#   关键词直接决定分数，之后觉得哪里判得不公，改关键词即可。
# ============================================================

