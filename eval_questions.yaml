# ============================================================
# 评测集 v1（L3 调优用）— 主人：马博文
# ------------------------------------------------------------
# 怎么用：
#   1) 每题填 points（3~5 个要点）：每个要点写成 "关键词1|关键词2|同义写法"
#      回答文本里出现【任一关键词】= 该要点命中（不区分大小写）
#   2) 跑基线：      uv run python eval_kb.py
#   3) 改一个变量（rerank / top-k / 切块 / 提示词）后再跑一次：
#                    uv run python eval_kb.py
#   4) 对比两次结果：uv run python eval_kb.py --compare eval_results/基线.json
#
# 规则：
#   - 题目和要点【必须你自己写】——这是评测的核心能力，AI 不能替
#   - q/source 空着的题会被自动跳过（不会报错）
#   - source = 预期来源关键词（会去匹配检索结果的来源文件名）
# ============================================================

